server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA deep links (e.g. /books/123) have no matching file on disk;
    # without this every non-root route 404s on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend has no CORS-free path in production, so the API is proxied
    # same-origin through this nginx instead of relying on browser CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
